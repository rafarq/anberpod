[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anberpod"
version = "0.1.0"
description = "Local/offline foundation for AnberPod on MuOS"
requires-python = ">=3.10"
dependencies = ["Pillow==12.3.0"]

[project.scripts]
anberpod = "anberpod.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anberpod = ["migrations/*.sql", "assets/icons/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
